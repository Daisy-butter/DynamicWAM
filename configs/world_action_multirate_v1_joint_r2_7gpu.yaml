# Joint retrain after fast_warmup_r2. Seven processes, ZeRO-0, bf16.
# Effective batch = 1 * 7 * 2 = 14 (near the single-GPU recipe of 16).
# validation_batches caps the end-of-run null-bridge val walk.
schema_version: 3
baseline: world_action_multirate_v1
phase: cross_time_joint

paths:
  project_root: ..
  packed_dataset: data/packed/domino_absolute_motion_v2
  source_dataset: data/converted/domino_exact_time
  wan_root: external/Wan2.2-TI2V-5B
  training_runs: /SSD_DISK/users/wuruihan/DynamicWAM/outputs/training
  init_checkpoint: /SSD_DISK/users/wuruihan/DynamicWAM/outputs/training/world_action_multirate_fast_warmup_r2/exports/multirate_step_1000.pt

pairing:
  splits: [clean, randomized]
  execute_horizon: 4
  every_fast_queries: 4
  stress_offsets: [48]
  seconds_per_frame: 0.03333333333333333
  partition_seed: 20260928
  validation_fraction: 0.1
  clock_mode: required
  samples_per_episode: 10
  stress_probability: 0.0
  age_weighting: schedule_mixture

training:
  name: world_action_multirate_joint_r2_7gpu
  device: cuda
  log_level: INFO
  max_steps: 1000
  per_device_batch_size: 1
  gradient_accumulation_steps: 2
  action_learning_rate: 5.0e-5
  fast_learning_rate: 5.0e-5
  video_learning_rate: 1.0e-5
  weight_decay: 1.0e-3
  min_lr_ratio: 1.0e-5
  warmup_steps: 0
  grad_clip_norm: 1.0
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  log_interval: 10
  checkpoint_interval: 1000
  checkpoint_total_limit: 10
  resume_from: ""
  null_bridge_probability: 0.05
  max_open_shards: 16
  validation_batches: 32

loss:
  fast_weight: 1.0
  action_weight: 1.0
  video_weight: 0.001

flow_matching:
  shift: 5.0
  sigma_min: 0.0
  extra_one_step: true
  training_timesteps: 1000

model:
  future_video_size: [192, 160]
  global_downsample_rate: 3
  compact_wan:
    precision: bfloat16
    dim: 2048
    ffn_dim: 8192
    num_heads: 16
    num_layers: 12
    head_dim: 128
    hidden_anchor_layers: [1, 3, 5, 7, 9, 12]
    motion_anchor_layers: [6, 8, 10, 12]
    teacher_layer_mapping: [1, 2, 4, 6, 8, 11, 14, 17, 20, 23, 26, 30]
  action_expert:
    dim: 768
    ffn_dim: 3072
    num_layers: 12
    chunk_size: 16
    state_dim: 14
    action_dim: 14
  fast_conditioner:
    dim: 768
    layers: 12
    heads: 8
    head_dim: 96
    text_dim: 4096
    state_dim: 14
    sim_scale: 1.0
    action_scale: 16.0

distributed:
  zero_stage: 0
  bf16: true
  steps_per_print: 2000
